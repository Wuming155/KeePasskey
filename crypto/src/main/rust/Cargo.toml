[package]
name = "keepasskey_argon2"
version = "0.1.0"
edition = "2021"
# 说明（ISSUE-P3-34/35/36）：crate 与 `[lib] name` 仍为历史的 `keepasskey_argon2`
# （`System.loadLibrary`、Gradle `cargoNdkBuild`、CI `Native gate` 的 .so 名断言与 6 份文档
# 均绑定该名），但本 crate 已扩展为**项目原生密码内核**：
#   - `lib.rs`           Argon2 KDF（ISSUE-P2-14）
#   - `aes_kdf.rs`       AES-KDF（ISSUE-P3-34）
#   - `twofish_cbc.rs`   Twofish-CBC/PKCS7（ISSUE-P3-35）
#   - `strength.rs`      口令强度评估（ISSUE-P3-36）
# 改名会牵动 CI 与 6 份文档却零功能收益，故**有意保留**并以本注释消除歧义。
description = "KeePasskey native crypto kernel (Argon2 KDF + AES-KDF + Twofish-CBC + password strength)"
# ISSUE-P3-72：本 crate 为 `publish = false` 的**内部组件**，不单独对外分发——其源码随主工程
# （仓库根 LICENSE = GPL-3.0，见 README §「许可证」）整体分发，故对外生效许可即主工程许可。
# 此处 `Apache-2.0 OR MIT` 仅为本 crate 源码的 Cargo 元数据声明，不改变主工程许可；
# 与主工程许可单向兼容，无实质冲突。
license = "Apache-2.0 OR MIT"
publish = false

[lib]
name = "keepasskey_argon2"
crate-type = ["cdylib", "rlib"]

[dependencies]
# 最小化依赖面（供应链收敛）：关闭默认 password-hash/rand，仅取 KDF 所需特性。
# - alloc：hash_password_into 所需
# - kdf：argon2 0.6.0 低层 KDF API（hash_password_into 系列）
# - parallel：启用 rayon 多线程 lanes 计算，保住 p=2/p=4 多核收益（对齐 C 侧 threads=parallelism，缓解 R1）
# - zeroize：argon2 内部秘密缓冲擦除——**实证口径（ISSUE-P2-56）**：该 feature 在 argon2 0.6.0
#   中只覆盖 initial_hash / finalize 的 blockhash（lib.rs:389-390 / 570-573），**不覆盖**
#   hash_password_into 内部分配的 m_cost 主工作内存（Blocks::drop 仅 dealloc）；
#   主工作内存的清零由本 crate 自持 `Zeroizing<Vec<Block>>` + hash_password_into_with_memory 实现。
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "kdf", "parallel", "zeroize"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# JNI 边界（Batch 2）：仅需原生方法实现侧，关闭默认 invocation（不创建 JVM）
jni = { version = "0.21", default-features = false }
# ISSUE-P3-34/35：分组密码与摘要。三者同处 RustCrypto 新 `hybrid-array` 线
# （aes/twofish 共用 `cipher 0.5.2`，sha2 0.11 与 argon2 传递的 blake2 0.11 共用 `digest 0.11.3`），
# 依赖树**无重复密码学实现**（`deny.toml [bans] wildcards = "deny"` 下零新增冲突）。
# 一律 `default-features = false` 收敛面：sha2 默认 `oid` 会额外拉入 `const-oid`，此处不需要；
# `zeroize` 开启后分组密码的**密钥调度随对象析构确定性归零**（对齐项目秘密治理纪律）。
# ISSUE-P2-57（审计 RUST-02）追加：sha2 亦启用 `zeroize`（= `digest/zeroize`）——
# 该 feature 使 `Sha256` 类型满足 `zeroize::ZeroizeOnDrop`，且 `Sha256VarCore::finalize_*_core`
# 在收尾时**显式擦除内部 state / block_len**（AES-KDF 的 composite key 即驻留其中）。
aes = { version = "0.9.3", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11.0", default-features = false, features = ["zeroize"] }
twofish = { version = "0.8.0", default-features = false, features = ["zeroize"] }
# ISSUE-P3-153（§145）：ChaCha20（RFC 7539 / KDBX 外层 cipher 候选）。RustCrypto 官方 crate，
# `zeroize` 使密钥调度随对象析构归零（与 aes/twofish 同纪律）；无 std 依赖。
# seek 位置以 64 字节块计（ChaChaCore 的 u32 块计数器，state[12]）。
chacha20 = { version = "0.9.1", default-features = false, features = ["zeroize"] }
# ISSUE-P3-153（§146）：Passkey 签名内核。RustCrypto 官方 p256（ECDSA P-256，确定性 RFC 6979
# + SHA-256，与 BC 生产路径确定性口径一致）与 ed25519-dalek 2（EdDSA 确定性）。
# RS256 已裁定**不下沉**（真机实测 rsa crate 慢于 BC 1.6~2.1×）。
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# 不设 panic = "abort"：JNI 边界需 catch_unwind 把 panic 归一为返回 null（Batch 2），
# abort 会直接终止 App 进程，比 C 侧返回 NULL 更危险。
