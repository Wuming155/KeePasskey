# TASK-20（P3）：OWASP Dependency-Check 供应链依赖漏洞巡检。
#
# ISSUE-P3-09（ZT-20）AC4 整改要点：
# 1. **本流水线已具备真实失败阻断能力**：init 脚本 failBuildOnCVSS=7.0（CVSS ≥ HIGH 即失败）
#    且 failOnError=true（扫描无法完成同样失败，fail-closed）；workflow 侧不再有任何
#    continue-on-error 吞掉失败。
# 2. 全部 Action 以 **commit SHA 钉死**（保留 `# vX.Y.Z` 注释）；本次只做 SHA 钉死，
#    不跨大版本升级（上游已有新 major，升级需另行验证，见 docs/.handoff/ISSUE-P3-09.md）。
# 3. 除本巡检外，构建/测试/Lint 门禁与 Rust 供应链闸门见 .github/workflows/build.yml。
#
# 触发策略（**手动优先**，保持既有取舍）：
# - 仅 `workflow_dispatch`：云端定时扫描已停用，需要时到 Actions 页手动 Run workflow；
#   如需自动巡检，在本文件 `on:` 下补回 `schedule` / `push` / `pull_request` 段即可。
# - 报告以 artifact 归档并按 CVSS 阈值阻断；SARIF 上传 GitHub Code Scanning
#   （Security 页可视化）；误报登记 suppression 白名单
#   （.github/owasp-dependency-suppressions.xml，当前为空白名单）。
# - NVD API Key 可选：配置仓库 Secret `NVD_API_KEY`（https://nvd.nist.gov/developers/vulnerabilities）
#   可显著提升 NVD 数据同步速率；未配置时插件走官方托管镜像 datafeed（见 init 脚本 nvd{}）。
name: dependency-scan

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # 上传 SARIF 至 Code Scanning

concurrency:
  group: dependency-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 首次 NVD 数据同步较慢，预留余量
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # 本步骤失败即整条流水线失败（CVSS ≥ 7.0 或扫描内部错误），不再被 continue-on-error 掩盖
      - name: Run OWASP Dependency-Check (aggregate)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${NVD_API_KEY:-}" ]]; then
            args+=("-Dorg.owasp.dependencycheck.nvd.api.key=${NVD_API_KEY}")
          fi
          ./gradlew --no-daemon dependencyCheckAggregate \
            -I .github/dependency-check.init.gradle.kts \
            "${args[@]}" \
            --console=plain

      # 无报告 = 扫描未产出结论，按 if-no-files-found: error 显式暴露，而非静默放过
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-check-report
          path: |
            **/build/reports/dependency-check/dependency-check-report.*
          if-no-files-found: error

      # 扫描失败时仍需把已产出结果送到 Security 页；本步骤自身失败也不再被吞掉
      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: build/reports/dependency-check/dependency-check-report.sarif
