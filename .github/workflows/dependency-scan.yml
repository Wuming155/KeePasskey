# TASK-20（P3）：OWASP Dependency-Check 供应链依赖漏洞巡检。
#
# 策略（首次仅告警）：
# - 每日定时（18:00 UTC ≈ 北京次日 02:00）+ 手动触发 + 依赖清单变更（push/PR）即扫；
# - 恒不阻断（init 脚本 failBuildOnCVSS=11），报告以 artifact 归档，
#   SARIF 上传 GitHub Code Scanning（Security 页可视化）；误报登记 suppression 白名单；
# - NVD API Key 可选：配置仓库 Secret `NVD_API_KEY`（https://nvd.nist.gov/developers/vulnerabilities）
#   可显著提升 NVD 数据同步速率；未配置时插件走匿名节流，首轮数据下载较慢属正常。
name: dependency-scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"
  push:
    branches: [ "main" ]
    paths:
      - "**/build.gradle.kts"
      - "gradle/**"
      - "settings.gradle.kts"
      - ".github/workflows/dependency-scan.yml"
      - ".github/dependency-check.init.gradle.kts"
  pull_request:
    paths:
      - "**/build.gradle.kts"
      - "gradle/**"
      - "settings.gradle.kts"
      - ".github/dependency-check.init.gradle.kts"

permissions:
  contents: read
  security-events: write # 上传 SARIF 至 Code Scanning

concurrency:
  group: dependency-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owasp-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 首次 NVD 数据同步较慢，预留余量
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run OWASP Dependency-Check (aggregate)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${NVD_API_KEY:-}" ]]; then
            args+=("-Dorg.owasp.dependencycheck.nvd.api.key=${NVD_API_KEY}")
          fi
          ./gradlew --no-daemon dependencyCheckAggregate \
            -I .github/dependency-check.init.gradle.kts \
            "${args[@]}" \
            --console=plain

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: |
            **/build/reports/dependency-check/dependency-check-report.*
          if-no-files-found: warn

      - name: Upload SARIF to Code Scanning
        if: always()
        continue-on-error: true # 扫描结果不应阻断（首次仅告警）；即使无 SARIF 也不使作业失败
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/dependency-check/dependency-check-report.sarif
