name: dependency-scan

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: dependency-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owasp-dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Compute weekly cache key
        run: echo "NVD_CACHE_WEEK=$(date -u +%G-%V)" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-nvd-${{ env.NVD_CACHE_WEEK }}
          restore-keys: dependency-check-nvd-
      - name: Scan production dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew --no-daemon dependencyCheckAggregate -I .github/dependency-check.init.gradle.kts --console=plain
      # 聚合任务的退出码不足以判定漏洞阈值；报告缺失也必须失败。
      - name: Verify CVSS threshold
        if: always()
        run: python3 .github/check_dependency_cvss.py build/reports/dependency-check/dependency-check-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-check-report
          path: '**/build/reports/dependency-check/dependency-check-report.*'
          if-no-files-found: error
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: build/reports/dependency-check/dependency-check-report.sarif
