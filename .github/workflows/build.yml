name: build

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  RUST_TOOLCHAIN: "1.97.1"
  CARGO_NDK_VERSION: "4.1.2"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  hygiene-gate:
    name: Documentation and safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/doc/gate_readings.py

  fast-gate:
    name: Unit tests, interoperability and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew test --console=plain
      - name: Install interoperability tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends keepassxc
          python3 -m pip install --break-system-packages --quiet pykeepass==4.2.0 cryptography==50.0.0
      - run: python3 tools/passkey-interop/verify_interop.py
      # Lint 的任务图会触发打包原生库；静态分析不需要交叉编译。
      - run: ./gradlew lint -x :crypto:cargoNdkBuild --console=plain
      - name: Compile device tests
        run: |
          ./gradlew :core:compileDebugAndroidTestKotlin :crypto:compileDebugAndroidTestKotlin \
            :database:compileDebugAndroidTestKotlin :sync:compileDebugAndroidTestKotlin \
            :app:compileDebugAndroidTestKotlin --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fast-gate-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: warn

  native-gate:
    name: Native build and release packaging
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"
      - name: Install Android build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}" "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - run: cargo install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked
      - run: ./gradlew :crypto:cargoNdkBuild :crypto:test :app:assembleDebug --console=plain
      - name: Verify native tests and JNI exports
        run: |
          set -euo pipefail
          rustc --version | grep -q "$RUST_TOOLCHAIN"
          python3 - <<'PY'
          import glob, os, subprocess, xml.etree.ElementTree as ET
          suites = [ET.parse(f).getroot() for f in glob.glob('crypto/build/test-results/testDebugUnitTest/*.xml')]
          assert sum(int(s.get('tests', 0)) for s in suites) > 0, '未执行原生用例'
          assert sum(int(s.get('skipped', 0)) for s in suites) == 0, '原生用例被跳过'
          expected = {
              'kdf_NativeArgon2_deriveKey', 'kdf_NativeAesKdf_deriveKey',
              'cipher_NativeTwofish_cbcEncryptBlocks', 'cipher_NativeTwofish_cbcDecryptBlocks',
              'cipher_NativeChaCha20_applyKeystream', 'cipher_NativeChaCha20_applyKeystreamDirect',
              'cipher_NativeAes_cbcEncryptBlocks', 'cipher_NativeAes_cbcDecryptBlocks',
              'cipher_NativeAes_cbcEncryptBlocksDirect', 'cipher_NativeAes_cbcDecryptBlocksDirect',
              'strength_NativePasswordStrength_estimate',
              'passkey_NativePasskeySign_es256Sign', 'passkey_NativePasskeySign_ed25519Sign',
          }
          expected = {'Java_com_keepasskey_crypto_' + name for name in expected}
          nm = os.environ['ANDROID_NDK_HOME'] + '/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm'
          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'):
              output = subprocess.check_output([nm, '--dynamic', '--defined-only', f'crypto/build/rust/jniLibs/{abi}/libkeepasskey_argon2.so'], text=True)
              actual = {line.split()[-1] for line in output.splitlines() if 'Java_com_keepasskey' in line}
              assert actual == expected, (abi, expected - actual, actual - expected)
          PY
      - name: Generate temporary CI signing key
        run: |
          set -euo pipefail
          CI_KEYSTORE_PASSWORD="$(openssl rand -base64 24)"
          keytool -genkeypair -keystore "${RUNNER_TEMP}/ci-release.jks" -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 3650 -alias ci \
            -storepass "${CI_KEYSTORE_PASSWORD}" -keypass "${CI_KEYSTORE_PASSWORD}" \
            -dname "CN=KeePasskey CI, OU=CI, O=KeePasskey, C=CN"
          {
            echo "KEYSTORE_FILE=${RUNNER_TEMP}/ci-release.jks"
            echo "KEYSTORE_PASSWORD=${CI_KEYSTORE_PASSWORD}"
            echo "KEY_ALIAS=ci"
            echo "KEY_PASSWORD=${CI_KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - run: ./gradlew :app:assembleRelease --console=plain
      - name: Verify signatures and packaged ABIs
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify \
            --verbose --v4-signature-file "${apk}.idsig" "$apk" | tee /tmp/signatures.txt
          unzip -Z1 "$apk" > /tmp/apk-files.txt
          if grep -Eq '^META-INF/.*\.(SF|RSA|DSA|EC)$' /tmp/apk-files.txt; then exit 1; fi
          # minSdk >= 28 且启用 v3 时，AGP 省略 v2 块。
          grep -q 'Verified using v1 scheme (JAR signing): false' /tmp/signatures.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): false' /tmp/signatures.txt
          grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/signatures.txt
          grep -q 'Verified using v4 scheme (APK Signature Scheme v4): true' /tmp/signatures.txt
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            grep -Fxq "lib/${abi}/libkeepasskey_argon2.so" /tmp/apk-files.txt
          done
          printf '%s\n' '本 APK 使用一次性 CI 密钥，仅供测试，不是官方发布包。R8 映射不随产物分发。' \
            > app/build/outputs/apk/release/NOT-FOR-RELEASE.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-gate-ci-signed-NOT-FOR-RELEASE
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.idsig
            app/build/outputs/apk/release/NOT-FOR-RELEASE.txt
          if-no-files-found: warn

  rust-supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crypto/src/main/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - run: cargo test --locked
      - run: cargo install cargo-deny --version "${CARGO_DENY_VERSION}" --locked
      - run: cargo deny check

  device-gate:
    name: Emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"
      - name: Install Android tools and emulator image
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}" "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" "emulator" "system-images;android-36.1;google_apis;x86_64"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - run: cargo install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked
      - run: ./gradlew :crypto:cargoNdkBuild --console=plain
      - name: Start isolated emulator
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | avdmanager create avd --name ci-device \
            --package "system-images;android-36.1;google_apis;x86_64" --device pixel
          if [ ! -f "$ANDROID_AVD_HOME/ci-device.ini" ]; then
            SRC="$(find "$HOME" -maxdepth 6 -name 'ci-device.ini' 2>/dev/null | head -1)"
            test -n "$SRC"
            cp -a "$(dirname "$SRC")"/ci-device.ini "$(dirname "$SRC")"/ci-device.avd "$ANDROID_AVD_HOME"/
          fi
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          adb start-server
          "${ANDROID_SDK_ROOT}/emulator/emulator" -avd ci-device \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -port 5554 &
          for i in $(seq 1 120); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            [ "$boot" = "1" ] && break
            sleep 10
          done
          test "$boot" = "1"
      # 此用例需要真实系统填充 UI 及已录入生物识别的设备，由本地专项验收。
      - run: |
          ./gradlew connectedDebugAndroidTest --console=plain \
            -Pandroid.testInstrumentationRunnerArguments.notClass=com.keepasskey.app.autofill.AutofillAuthChainDeviceTest
      - run: python3 tools/device/check_connected_device_results.py
        if: always()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: device-gate-reports
          path: '**/build/outputs/androidTest-results/connected/**'
          if-no-files-found: warn
