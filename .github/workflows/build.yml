# ISSUE-P3-09（ZT-20）AC4 / AC6：构建、测试与供应链门禁。
#
# 设计要点：
# 1. **两个构建门禁并行存在**，各自真实可跑：
#    - fast-gate：单元测试 + Android Lint，**不安装 NDK/Rust**。依据是「纯 `test` 不触发
#      `:crypto:cargoNdkBuild`；原生内核仅由 `assemble*` 触发」，目的是在 3~5 分钟内给出快速反馈。
#      **注意（ISSUE-P2-217 更正）**：`lint` **会**经 AGP 的 lint 模型链
#      （`bundleDebugLocalLintAar` → `mergeDebugNativeLibs`）触达 `:crypto:cargoNdkBuild`，
#      故该步骤显式 `-x :crypto:cargoNdkBuild`；详见该步骤内的完整依据。
#    - native-gate：安装固定版本 NDK + Rust 工具链 + cargo-ndk 后执行 4 ABI 原生交叉编译
#      与 `assembleDebug` / `assembleRelease`（后者让 R8 真实执行，是 ProGuard 收窄的硬校验）。
# 2. **三方供应链闸门** rust-supply-chain：Rust 侧 `cargo test` + `cargo deny check`
#    （advisories/bans/licenses/sources 四项，advisories 失败即阻断）。
# 3. 全部 Action 以 **commit SHA 钉死**并保留 `# vX.Y.Z` 注释（Dependabot 会同步升级 SHA 与注释）。
#    本次只做「SHA 钉死」，**不跨大版本升级**：检查时上游已有 actions/checkout v7.0.1 /
#    actions/setup-java v6.0.1，但大版本升级涉及 Node 运行时与输入契约变更，无法在本批次
#    本地验证，故沿用仓库在用的 v4 线，升级另立条目（见 docs/records/退役依据承接-ISSUE-P3-09.md）。
# 4. 版本固定：NDK / Rust / cargo-ndk / cargo-deny 全部在 env 中写死，禁止漂移。
#    - NDK 28.2.13676358 与 crypto/build.gradle.kts:13 的 ndkVersionStr 严格一致；
#    - Rust 1.97.1 为本次整改在开发机实际验证通过的 stable 版本（crate 无 rust-toolchain.toml，
#      故在 workflow 侧固定，升级需人工评审）；`env.RUST_TOOLCHAIN` 经各 job 的
#      dtolnay/rust-toolchain 的 `with.toolchain` 展开（ISSUE-P2-502：`steps.with` 可用 env 上下文），
#      并由 native-gate 的「校验实际工具链版本」步骤断言 rustc 实际版本含该值
#      —— 改 env 即真实生效，工具链漂移即红（旧版三处字面量与本 env 实为零消费的装饰性双写）。
# 5. CI 环境的 release 构建**没有** keystore.properties / release.jks（两者均不入库），
#    因此 native-gate 先现场生成一把**一次性 CI 密钥**用于验证签名方案，再断言
#    「v1 关闭（包内无 META-INF/*.SF|*.RSA）、v2 块按 AGP 规则省略、v3 + v4 启用」。
#    该密钥仅存在于 runner 临时目录。
# 6. **JDK 21（而非 17）**：`gradle/gradle-daemon-jvm.properties`（由 `updateDaemonJvm` 生成）
#    声明 `toolchainVersion=21`，Gradle 守护进程必须运行在 JDK 21 上；本仓库全部已获证据的
#    构建/测试/打包（assembleDebug / assembleRelease / test）均产自 JDK 21 守护进程
#    （本机 daemon 日志：`javaHome=…jdk-21.0.11.10-hotspot, javaVersion=21`）。
#    CI 显式安装 JDK 21，避免依赖 runner 镜像自带 JDK 的自动探测/按需下载。
name: build

on:
  # ISSUE-P3-316（2026-09-25 触发频率治理）：原 push(main) + PR 全量触发下 5 天产生 126 次 run，
  # 纯文档提交也跑满 5 job（含 Device gate）。改为每日定时巡检 + 手动触发；
  # 本地门禁（gradlew test 全绿 + gate_readings 7/7）仍是每批入库前置，CI 为第二道独立层；
  # 需要即时验证时在 Actions 页手动 Run workflow。
  schedule:
    - cron: "0 21 * * *" # 每日 UTC 21:00（北京 05:00）全量巡检
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # === 构建工具链固定版本（禁止漂移）===
  ANDROID_NDK_VERSION: "28.2.13676358"
  # 平台包名必须带 minor 版本号：SDK 仓库中**不存在** `platforms;android-37`，
  # 实际包名为 `platforms;android-37.0`（2026-09-10 以 `sdkmanager --list --channel=0`
  # 实测核对：仅有 37.0 / 37.1 / 37.2 与 37.2-beta*；本机 platforms/android-37.0/package.xml
  # 亦声明 path="platforms;android-37.0"）。写成 android-37 会使 `sdkmanager --install`
  # 报「Failed to find package」，且 compileSdk 37 无平台可解析 → 首次运行必红。
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  RUST_TOOLCHAIN: "1.97.1"
  CARGO_NDK_VERSION: "4.1.2"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  # ---------------------------------------------------------------------------
  # 门禁 0：工程卫生硬门禁（自研度量 / 索引 / 重言断言，fail-closed）。
  # 动因（§281）：行数分档与超长函数此前只靠人工与本地脚本，无 CI 兜底；
  # 现将 `count_line_tiers` / `long_functions` 等自研机检挂进流水线，
  # 阈值越过即红（禁止 `|| true` / continue-on-error 吞掉）。
  # 判据与棘轮口径见各脚本文档串；本 job 不依赖 JDK / NDK，秒级完成。
  # 第九条（ISSUE-P3-459 续）`check_launch_language_seed.py`：语言偏好真源是 DataStore，
  # 首值异步冷读，冷启动首帧拿不到值就按系统 locale 渲染一帧 ⇒「先闪一帧中文」。
  # 该形态 2026-09 已实测过一次：机检全绿（只盯字面量有没有中文）、真机却整屏中文（§414 事故），
  # 故此处按**接线点**钉死四条（Application 灌种 / Compose 首帧 initialValue / 取串通道 /
  # 语言写入点镜像），缺一即红。
  # 第十条（ISSUE-P0-531）`check_projection_read_safety.py`：投影面读「已清零的
  # `ProtectedString`」曾让真机闪退（2026-10-08 WebDAV 同步后连崩三次）。擦除侧已改为
  # 「先发布、后擦除」，但残余调度窗口只能由投影面降级关闭 ⇒ 此处禁止投影面再出现裸
  # `readString()` / `readUtf8()` / `readChars()`（写路径的 fail-fast **刻意不在**判据内，
  # 就地降级会把空值写进用户的库）。同脚本另钉「先查 `cleared` 再裸读」的两步式（ISSUE-P1-537）
  # 与非交付面 fail-open 直读 `password`（ISSUE-P2-539）。
  # 第十一条（ISSUE-P1-538）`check_raw_coroutine_scope.py`：应用级 scope 必须经 `guardedScope(...)`
  # 工厂创建。§474 的普查口径写死为 `CoroutineScope(SupervisorJob(` ⇒ 漏掉了不带 SupervisorJob 的
  # 裸形态（`AppShellLocalization` 的 `CoroutineScope(Dispatchers.IO)`）；裸构造无异常处理器 ⇒
  # 逃逸异常直达线程默认处理器并杀进程。故按**构造形态**钉死，不再依赖人工普查。
  # ---------------------------------------------------------------------------
  hygiene-gate:
    name: Hygiene gate (line tiers, long functions, docs index, tautological asserts, recheck, type names, box-slot children, launch-language seed wiring, projection read safety, raw coroutine scope)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 以下机检均为 fail-closed（非 0 即红）；**条数不写死**——清单以本 run 块为唯一真相源，
      # 写死条数必与 CI 漂移。顺序：规模闸门 → 文档链接 →
      # 归档索引双向一致 → 重言断言 → 复核报告禁用短语 → 类型名有界性（PD-34）→
      # Box 内容槽同层兄弟叠放（ISSUE-P3-337 编辑页 Q1 按钮叠字：`BentoCard` 内容槽是 Box，
      # 同层兄弟互相叠放而非上下流动，编译期与 @Preview 都可能看不出来，故挂成闸门；
      # ISSUE-P3-457 扩面：框架文本框 `supportingText` 槽同在 Box 内 + 「多发射助手函数」入槽）→
      # 启动语言种子接线（ISSUE-P3-459 续）→ 投影读取安全（含两步式 / 口令 fail-open）→
      # 裸 scope 收口（ISSUE-P1-538）。
      # `long_functions` 用默认阈值 100（§280 收工线 functions_ge_100=0 不得回潮）；
      # 传更低阈值仅作本地普查。
      - name: 规模与卫生机检（fail-closed）
        run: |
          set -euo pipefail
          python3 tools/doc/count_line_tiers.py
          python3 tools/doc/long_functions.py
          python3 tools/doc/check_md_links.py
          python3 tools/doc/check_resolved_index_sync.py
          python3 tools/audit/check_tautological_assertions.py
          python3 tools/audit/check_recheck_consistency.py
          python3 tools/doc/check_bounded_type_names.py
          python3 tools/doc/check_box_slot_children.py
          python3 tools/audit/check_launch_language_seed.py
          python3 tools/doc/check_projection_read_safety.py
          python3 tools/doc/check_raw_coroutine_scope.py

  # ---------------------------------------------------------------------------
  # 门禁 1：快速门禁（不构建原生）
  # ---------------------------------------------------------------------------
  fast-gate:
    name: Fast gate (unit tests + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ISSUE-P3-69：校验入库 gradle-wrapper.jar 未被篡改（本仓 jar 哈希与 Gradle 官方
      # 9.7.1 Wrapper JAR 校验和逐位一致，2026-09-12 实测）。
      - name: 校验 Gradle Wrapper 完整性
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (含依赖与构建缓存)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: 单元测试（全模块）
        run: ./gradlew test --console=plain

      # ISSUE-P2-519：通行密钥 KPEX 互操作对拍接入 CI（此前无任何自动调用点，
      # 见批次 449.5 的如实声明；「闸门存在 ≠ 闸门被执行」是 ISSUE-P3-305 同型根因）。
      # 前置产物由上一「单元测试（全模块）」步骤内的 PasskeyInteropProbeTest（JVM 单测，
      # 无 Assume 门控）产出到 database/build/interop-probe/。
      # 退出码口径（verify_interop.py）：0 = 判据全过 / 1 = 判据失败 /
      # 2 = 环境缺失（缺 keepassxc-cli，显式失败不得当绿——F22 的整改口径）。
      # 缺 pip 依赖时脚本以非 0 硬退出（verify_interop.py:56-60），故依赖安装失败必红；
      # 此处**没有** `|| true` / `continue-on-error` 之类吞掉失败的写法。
      # 如实声明：本机无 CI 环境，apt 提供的 keepassxc-cli 版本（Ubuntu 24.04 ≈ 2.7.6）
      # 与本机对拍所用 2.7.12 的差异未验证；若版本敏感判据首跑红，按 fail-closed 可见处置。
      - name: 安装对拍依赖（keepassxc-cli + pykeepass/cryptography）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends keepassxc
          python3 -m pip install --break-system-packages --quiet pykeepass cryptography

      - name: 通行密钥互操作对拍（KPEX 双实现判据，fail-closed）
        run: |
          ls -la database/build/interop-probe/
          python3 tools/passkey-interop/verify_interop.py

      # ISSUE-P2-217：`lint` 会经 AGP 的 lint 模型链触达原生构建——
      #   `:crypto:lint` → `:crypto:lintAnalyzeDebug` → `:crypto:generateDebugLintModel`
      #   → `:crypto:writeDebugLintModelMetadata` → `:crypto:bundleDebugLocalLintAar`
      #   → `:crypto:mergeDebugNativeLibs` → `:crypto:cargoNdkBuild`
      # （2026-09-20 在本机以 `./gradlew lint --dry-run` 实测：任务清单含 `:crypto:cargoNdkBuild`；
      #  同一 dry-run 下 `./gradlew test --dry-run` 不含它，故污染源是 Lint 而非单测）。
      # 本 job 按设计**不装** NDK / Rust / cargo-ndk，该步骤此前遂恒在「工具缺失」处失败
      # （`error: no such command: ndk`），从未产出真实 Lint 判定。
      # 修法：**显式排除** `:crypto:cargoNdkBuild` 这一项。被排除的只有「为打包而做的原生
      # 交叉编译」——原生产物不参与任何静态分析，排除它不改变任何 lint 结论；
      # 此处**没有** `|| true` / `continue-on-error` 之类吞掉失败的写法：lint 任务自身的
      # 成功/失败判定完整保留（真实 Lint 失败仍使本步骤红）。
      # 若将来任务名漂移导致排除失效，本步骤会以「cargo-ndk 缺失」**响亮报红**
      # （fail-closed：绝不静默转绿）。
      - name: Android Lint（显式排除与静态分析无关的原生构建）
        run: ./gradlew lint -x :crypto:cargoNdkBuild --console=plain

      # ISSUE-P2-491（2026-10-05 立规）：**用例存在 ≠ 用例可编译**。
      # 实测事故：`ISSUE-P1-431` 移除 `keyFileBytes` 形参后，设备侧用例仍传该具名实参 ⇒
      # `:app:androidTest` **编译期**失败；而 `compileDebugAndroidTestKotlin` **不在 `test`
      # 任务依赖图内**、CI 四个 job 也从未编译设备侧源集 ⇒ AGENTS.md 测试资产纪律要求的
      # 「原生面改动须四层 `connectedDebugAndroidTest` 真机实跑」被**静默阻断**
      # （与 `ISSUE-P3-305`「闸门存在 ≠ 闸门被执行」同型，形态是「用例存在 ≠ 用例可编译」）。
      # 本步用**真编译任务**（非聚合任务 `:app:compileDebugAndroidTestSources`——它只做依赖
      # 编排，报 UP-TO-DATE 不能证明编译发生过）把五模块设备侧源集纳入机检。
      # 可留在本 job（不装 NDK）：dry-run 实测该任务图**不含** `:crypto:cargoNdkBuild`
      # （原生产物只参与打包、不参与 Kotlin 编译）。
      - name: 设备侧（androidTest）源集编译门禁（ISSUE-P2-491）
        run: |
          ./gradlew \
            :core:compileDebugAndroidTestKotlin \
            :crypto:compileDebugAndroidTestKotlin \
            :database:compileDebugAndroidTestKotlin \
            :sync:compileDebugAndroidTestKotlin \
            :app:compileDebugAndroidTestKotlin \
            --console=plain

      - name: 归档测试与 Lint 报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-gate-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 门禁 2：原生构建门禁（4 ABI Rust 内核 + Debug/Release 打包 + 签名方案断言）
  # ---------------------------------------------------------------------------
  native-gate:
    name: Native gate (4 ABI Rust, assembleDebug + assembleRelease)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (含依赖与构建缓存)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # ISSUE-P2-218：**必须显式传 packages**。v4.0.1 的默认值是 `tools platform-tools`，
          # 而裸 `tools` 包在远端 SDK 仓库中**已不存在**——2026-09-20 以
          # `https://dl.google.com/android/repository/repository2-1.xml` 与 `repository2-3.xml`
          # 实测：`path="tools"` 出现次数均为 0（只有 `build-tools;*` / `cmdline-tools;*` /
          # `platform-tools` 含 "tools" 子串）。默认值因此必然触发
          # `Warning: Failed to find package 'tools'` → `sdkmanager` 退出码 1 → 本步骤恒红，
          # 使 native-gate / device-gate 整体不可达。
          # 此处收窄为只需 platform-tools；NDK / 编译平台 / build-tools 由下一步
          # `sdkmanager --install` 按仓库固定版本安装，本 action 只负责供应
          # cmdline-tools（裸 `sdkmanager` 在 PATH 上的前提）与许可证接受。
          packages: "platform-tools"

      - name: 安装 NDK / 编译平台 / build-tools（版本与本仓库固定值一致）
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "ndk;${ANDROID_NDK_VERSION}" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"
          # crypto/build.gradle.kts 经 ANDROID_NDK_HOME 定位 cargo-ndk 所需链接器
          {
            echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

      - name: Set up Rust（固定版本 + 4 个 Android target）
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # ISSUE-P2-502：工具链版本取自 workflow env.RUST_TOOLCHAIN（单一事实源；`steps.with` 支持
          # env 上下文）——原来的「with: 不适于引用 workflow env」判断经官方 contexts 文档证伪。
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: 校验实际工具链版本与 env.RUST_TOOLCHAIN 一致（漂移即红）
        run: |
          set -euo pipefail
          rustc --version
          cargo --version
          java -version
          # ISSUE-P2-502：把原「可审计打印」升格为断言——rustc 实际版本不含 env.RUST_TOOLCHAIN 即失败，
          # 使 env 与安装工具链之间的漂移可见（原先只打印、零比对，属装饰性控制点）。
          rustc --version | grep -q "$RUST_TOOLCHAIN" \
            || { echo "::error::rustc 实际版本与 env.RUST_TOOLCHAIN=${RUST_TOOLCHAIN} 不一致（工具链漂移）"; exit 1; }

      - name: 安装 cargo-ndk（固定版本）
        run: cargo install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked

      - name: 4 ABI Rust Argon2 内核交叉编译（libkeepasskey_argon2.so × 4）
        run: ./gradlew :crypto:cargoNdkBuild --console=plain

      # ISSUE-P3-97：本 job 是**唯一**同时具备 Rust 工具链与本机原生产物的 job，必须在此真实执行
      # Gradle 侧原生用例并对 .so 导出符号做 nm 级核对。否则「cargo 缺失 ⇒ JNI 用例经 Assume
      # 整类跳过」会再次退化为「构建全绿」的假绿通道（fast-gate 不装 cargo，正是该形态）。
      - name: 原生内核单测真实执行（Gradle :crypto:test）
        run: ./gradlew :crypto:test --console=plain

      - name: 断言原生用例零跳过 + 4 ABI 导出符号核对（ISSUE-P3-97）
        run: |
          set -euo pipefail
          # 1) 用例数与跳过数：本 job 具备 cargo 与 4 ABI 产物，**没有任何**「有意的降级」理由，
          #    故跳过数必须为 0（历史形态：整类跳过而 task 级仍 BUILD SUCCESSFUL）。
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = skipped = 0
          for f in glob.glob("crypto/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(f).getroot()
              suites = [root] if root.tag == "testsuite" else list(root)
              for suite in suites:
                  total += int(suite.get("tests", 0))
                  skipped += int(suite.get("skipped", 0))
          print(f"原生用例：总数={total} 跳过={skipped}")
          if total == 0:
              print("::error::未发现任何原生用例结果——:crypto:test 未真实执行"); sys.exit(1)
          if skipped != 0:
              print(f"::error::原生用例被跳过 {skipped} 例；本 job 已装 cargo 与 4 ABI 产物，不得跳过"); sys.exit(1)
          PY
          # 2) 导出符号核对：JNI 定长契约要求每个 ABI 的 .so 导出集**逐名等于**下方
          #    expected 清单——**该清单是唯一事实源，本注释不写死条数**。
          #    为什么散文不得承载计数（ISSUE-P3-503）：历史上此处写死「10 个」，§145/§146/
          #    §147（AES-CBC ×2）、§187（ChaCha20 Direct）、§198（AES Direct ×2）逐次追加符号
          #    时只改清单不改散文 ⇒ 散文失真为「11 个」而实为 13 项，且穿越多次改动未被察觉。
          #    危害是双向的：按散文把清单「修正」回写死值反而会令真闸门变红。
          #    清单族谱（仅供溯源，不作为计数依据）：Argon2 / AES-KDF / Twofish ×2 /
          #    口令强度 5 项基线 → + ChaCha20 / Passkey ES256 / Passkey Ed25519（§145/§146）
          #    → + AES-256-CBC ×2（§147）→ + ChaCha20 Direct（§187 探针，§198 起生产化）
          #    → + AES Direct ×2（§198）。按 §73 立规「期望值必须实测而非引用」，清单为实测输出。
          #    **逐名核对**（而非只比数量）：「数量对而符号错」（如误删一个 `#[no_mangle]` 又
          #    误加另一个）只有逐名核对能拦住。
          nm="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          test -x "$nm"
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            so="crypto/build/rust/jniLibs/${abi}/libkeepasskey_argon2.so"
            test -f "$so"
            "$nm" --dynamic --defined-only "$so" \
              | grep -o 'Java_com_keepasskey[A-Za-z0-9_]*' | sort -u > "/tmp/${abi}.symbols"
            echo "${abi}: Java_com_keepasskey 导出数 = $(wc -l < "/tmp/${abi}.symbols")"
          done
          python3 - <<'PY'
          import sys
          expected = {
              "Java_com_keepasskey_crypto_kdf_NativeArgon2_deriveKey",
              "Java_com_keepasskey_crypto_kdf_NativeAesKdf_deriveKey",
              "Java_com_keepasskey_crypto_cipher_NativeTwofish_cbcEncryptBlocks",
              "Java_com_keepasskey_crypto_cipher_NativeTwofish_cbcDecryptBlocks",
              "Java_com_keepasskey_crypto_cipher_NativeChaCha20_applyKeystream",
              "Java_com_keepasskey_crypto_cipher_NativeAes_cbcEncryptBlocks",
              "Java_com_keepasskey_crypto_cipher_NativeAes_cbcDecryptBlocks",
              "Java_com_keepasskey_crypto_strength_NativePasswordStrength_estimate",
              "Java_com_keepasskey_crypto_passkey_NativePasskeySign_es256Sign",
              "Java_com_keepasskey_crypto_passkey_NativePasskeySign_ed25519Sign",
              # ISSUE-P3-187 AC②：ChaCha20 DirectByteBuffer 零拷贝（§187 探针，§198 起生产化）
              "Java_com_keepasskey_crypto_cipher_NativeChaCha20_applyKeystreamDirect",
              # ISSUE-P3-198：AES 直扣生产化（原地内核 + direct ByteBuffer）
              "Java_com_keepasskey_crypto_cipher_NativeAes_cbcEncryptBlocksDirect",
              "Java_com_keepasskey_crypto_cipher_NativeAes_cbcDecryptBlocksDirect",
          }
          failed = False
          for abi in ("arm64-v8a", "armeabi-v7a", "x86_64", "x86"):
              actual = set(open(f"/tmp/{abi}.symbols").read().split())
              if actual != expected:
                  print(f"::error::{abi} 的 JNI 导出符号与定长契约不一致；"
                        f"缺失={sorted(expected - actual)} 多余={sorted(actual - expected)}")
                  failed = True
          if failed:
              sys.exit(1)
          print(f"4 ABI 导出符号逐名核对通过（各 {len(expected)} 个）")
          PY

      - name: Assemble Debug（真实触发原生构建与 APK 打包）
        run: ./gradlew :app:assembleDebug --console=plain

      - name: 生成一次性 CI 测试密钥（**非发布签名**，仅用于校验签名方案）
        run: |
          set -euo pipefail
          # ISSUE-P3-265：签名口令改为 job 运行时随机生成（openssl rand -base64 24 → 32 字符），
          # 仓库内不再出现任何固定口令字面量。必须**只生成一次**并同时用于 keytool 的
          # storepass/keypass 与下方 GITHUB_ENV 导出——分两次随机会使 keystore 口令与
          # Gradle 读到的口令不一致，签名直接失败。随机值不会命中 app/build.gradle.kts
          # 口令闸门的黑名单与 __REPLACE_WITH 占位符（长度 32 ≥ 16 亦满足）。
          # 该口令仅保护 runner 临时目录里的一次性测试密钥：非机密、不可用于发布。
          CI_KEYSTORE_PASSWORD="$(openssl rand -base64 24)"
          keytool -genkeypair -v \
            -keystore "${RUNNER_TEMP}/ci-release.jks" \
            -storetype PKCS12 -keyalg RSA -keysize 2048 -validity 3650 \
            -alias ci -storepass "${CI_KEYSTORE_PASSWORD}" -keypass "${CI_KEYSTORE_PASSWORD}" \
            -dname "CN=KeePasskey CI, OU=CI, O=KeePasskey, C=CN"
          {
            echo "KEYSTORE_FILE=${RUNNER_TEMP}/ci-release.jks"
            echo "KEYSTORE_PASSWORD=${CI_KEYSTORE_PASSWORD}"
            echo "KEY_ALIAS=ci"
            echo "KEY_PASSWORD=${CI_KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Assemble Release（真实执行 R8 混淆与资源收缩）
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 断言 Release 签名方案（v1 关闭 / v2 块按 AGP 规则省略 / v3 + v4 启用）
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK=${apk}"
          apksigner="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -f "${apk}.idsig"
          # --v4-signature-file 必传：apksigner **不会**自动读取同目录下的 `<apk>.idsig`，
          # 不传该参数时 "Verified using v4 scheme (APK Signature Scheme v4): true" 永不出现
          # （恒为 false），原断言必然误红。
          # 实测（build-tools 37.0.0，2026-09-10，本机 app-release.apk + 同目录 .idsig）：
          #   不带 --v4-signature-file → v4: false；带该参数 → v4: true。
          "$apksigner" verify --verbose --v4-signature-file "${apk}.idsig" "$apk" \
            | tee /tmp/apksigner-verify.txt
          # v1（JAR 签名）必须缺席：包内不得存在 META-INF/*.SF 与 META-INF/*.RSA
          # （注意 apksigner 在 minSdk>=24 时对 v1 恒报 false，故以包内条目为硬断言）
          if unzip -l "$apk" | grep -Eq 'META-INF/.*\.(SF|RSA|DSA|EC)$'; then
            echo "::error::检测到 v1 JAR 签名残留（META-INF/*.SF|*.RSA），v1 未关闭"
            exit 1
          fi
          grep -q "Verified using v1 scheme (JAR signing): false" /tmp/apksigner-verify.txt
          # v2 块：AGP 在「v3 与 v2 同开且 minSdk ≥ 28」时**省略 v2 块**（本项目 minSdk 36，
          # 不存在 v2-only 设备，无功能缺口；基线见 docs/records/ci-静态校准记录.md 第 2 行）。故此处断言
          # 的是「v2 块必须缺席」——若产物重新出现 v2 块，说明签名方案语义已变更，必须人工复核。
          # 实测（build-tools 37.0.0，2026-09-10，本机签名产物 app-release.apk）：v2: false。
          if grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner-verify.txt; then
            echo "::error::产物意外包含 v2 签名块——签名方案语义已变更，需人工复核（基线为省略，见 docs/records/ci-静态校准记录.md）"
            exit 1
          fi
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/apksigner-verify.txt
          grep -q "Verified using v4 scheme (APK Signature Scheme v4): true" /tmp/apksigner-verify.txt

      - name: 断言 4 ABI 原生库已入包
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/libkeepasskey_argon2\.so'
          count=$(unzip -l "$apk" | grep -cE 'lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/libkeepasskey_argon2\.so')
          if [ "$count" -ne 4 ]; then
            echo "::error::原生库 ABI 数量为 ${count}，期望 4"
            exit 1
          fi

      - name: 标注 CI 产物性质（**非发布签名**，ISSUE-P3-126①）
        run: |
          set -euo pipefail
          cat > app/build/outputs/apk/release/NOT-FOR-RELEASE.txt <<'EOF'
          KeePasskey —— CI 产物说明：非发布签名
          =====================================
          本目录中的 app-release.apk 由 CI 用**一次性临时密钥**现场生成并签名，仅用于在流水线中
          校验「R8 混淆 + 资源收缩 + 签名方案（v1 关闭 / v3 + v4 启用）」是否成立。

          · 它**不是**官方发布构建：签名证书与官方发布证书**无关**，无法覆盖安装官方版本，
            也不代表任何发布身份；
          · 官方发布包由维护者以 release keystore 构建（口令来自本地 keystore.properties
            或 CI Secret），见 keystore.properties.example 与 app/build.gradle.kts 的构建期口令闸门
            （ISSUE-P2-55：黑名单 / 占位符 / 长度 < 16 一律终止配置）；
          · R8 去混淆映射（mapping/seeds/usage/configuration）**不随本产物归档**——公开仓库的
            artifact 上传等同**公开去混淆映射**（ISSUE-P3-123④ 整改）；
          · 本流水线改为只把映射的**摘要**（体积 / 行数 / SHA-256）写入 step summary：
            保留「保留面审计」能力，又不公开映射内容；
          · 需要完整映射做崩溃还原时，请在**本地或私有环境**复跑 assembleRelease，或经私有
            制品库传递——不要粘贴进公开 issue / PR；
          · 如你基于本产物对外分发，请先以正式密钥重新签名并自担后果。
          EOF
          cat app/build/outputs/apk/release/NOT-FOR-RELEASE.txt

      - name: 输出去混淆映射摘要（ISSUE-P3-123④：不公开映射本体，只留可审计摘要）
        if: always()
        run: |
          set -euo pipefail
          MAP_DIR=app/build/outputs/mapping/release
          {
            echo "## R8 去混淆映射摘要（**不随产物归档**）"
            echo ""
            echo "映射本体**不得**作为公开 artifact 上传：公开仓库的上传等同公开去混淆映射，"
            echo "对本应用（密码管理器）而言等于交出类 / 方法 / 字段命名全貌。"
            echo "以下摘要用于保留面审计（体积 / 行数 / 指纹），可安全公开。"
            echo ""
            echo "| 文件 | 体积(字节) | 行数 | SHA-256 |"
            echo "|---|---|---|---|"
            for f in mapping.txt seeds.txt usage.txt configuration.txt; do
              p="$MAP_DIR/$f"
              if [ -f "$p" ]; then
                echo "| $f | $(wc -c < "$p") | $(wc -l < "$p") | $(sha256sum "$p" | cut -d' ' -f1) |"
              else
                echo "| $f | (缺失) | - | - |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 归档 Release APK 与说明（**CI 临时签名**，非官方发布包；**不含** R8 去混淆映射）
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-gate-artifacts-ci-signed-NOT-FOR-RELEASE
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.idsig
            app/build/outputs/apk/release/NOT-FOR-RELEASE.txt
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 门禁 3：Rust 供应链（cargo test + cargo deny check，含 advisories）
  # ---------------------------------------------------------------------------
  rust-supply-chain:
    name: Rust supply chain (cargo test + cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crypto/src/main/rust
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust（固定版本 + 4 个 Android target，deny.toml 的 graph.targets 需要）
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # ISSUE-P2-502：与 workflow env.RUST_TOOLCHAIN 同源（不再手写字面量，防 job 间工具链分叉）
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: cargo test（Rust Argon2 内核单测，Cargo.lock 锁定的依赖树）
        run: cargo test --locked

      - name: 安装 cargo-deny（固定版本）
        run: cargo install cargo-deny --version "${CARGO_DENY_VERSION}" --locked

      # 阻断语义：deny.toml 的 [advisories] 未配置任何 ignore，且 yanked = "deny"，
      # 因此**任何 RUSTSEC 漏洞公告或 yanked 依赖都会使本步骤失败并阻断流水线**；
      # [licenses]/[bans]/[sources] 同样按 deny.toml 的允许清单从严判定。
      # 本步骤需联网克隆 https://github.com/rustsec/advisory-db（GitHub 网络可达即可）。
      - name: cargo deny check（advisories + bans + licenses + sources）
        run: cargo deny check

  # ---------------------------------------------------------------------------
  # 门禁 4：设备层门禁（ISSUE-P2-192 余量第 7 项：connected 层在 CI 真实执行）。
  #
  # 动因与边界（2026-09-19）：
  # 1. 此前 CI 永不跑 connected ⇒ 设备侧缺陷（§151 撞出的两项等）只在本地真机可复现，
  #    CI 上永久绿灯。本 job 以 x86_64 模拟器补上这道门禁。
  # 2. 模拟器镜像**实测核实**为 `system-images;android-36.1;google_apis;x86_64`——
  #    system-images 目录在 API 36 起同样带 minor 版本（写 android-36 会报包不存在，
  #    与 platforms;android-37.0 的坑同源）；开发机 Pixel_10 AVD 用的正是该镜像。
  # 3. 环境前提类设备用例已在本批 ISSUE-P2-192 第 8 项 Assume 化（API 前提 / TracerPid /
  #    生物识别录入态），前提不满足即跳过并计入 skipped，不再把「环境不满足」误读为
  #    「生产缺陷」；autofill 链路用例依赖已录入生物识别的真机环境，在模拟器上跳过属预期。
  #    AutofillAuthChainDeviceTest **显式排除**（notClass）：其设计验证环境为真机（真实系统
  #    填充 UI + 解锁屏 + 全局 autofill 服务改写与还原），模拟器上「系统填充 UI 呈现」一步
  #    属环境敏感面（2026-09-19 实测；另其 linePid 解析缺陷已同批修复），由本地真机承担。
  # 4. app 的 debug APK 含 4 ABI 原生库 ⇒ assembleDebug 需要真实 NDK + Rust 工具链
  #    （与 native-gate 同源版本），故本 job 必须先完成原生构建。
  # ---------------------------------------------------------------------------
  device-gate:
    name: Device gate (emulator connected tests, all modules)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (含依赖与构建缓存)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # ISSUE-P2-218：同 native-gate——显式传 packages 以避开 v4.0.1 默认值里的裸 `tools`
          # （该包在远端 SDK 仓库已不存在，实测依据见 native-gate 处）。
          packages: "platform-tools"

      - name: 安装 NDK / 编译平台 / build-tools / 模拟器镜像（版本与本仓库固定值一致）
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "ndk;${ANDROID_NDK_VERSION}" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "emulator" \
            "platform-tools" \
            "system-images;android-36.1;google_apis;x86_64"
          {
            echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"
          test -d "${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

      - name: Set up Rust（固定版本 + 4 个 Android target）
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # ISSUE-P2-502：与 workflow env.RUST_TOOLCHAIN 同源（不再手写字面量，防 job 间工具链分叉）
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: 安装 cargo-ndk（固定版本）
        run: cargo install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked

      - name: 4 ABI Rust 内核交叉编译（app debug APK 依赖 libkeepasskey_argon2.so）
        run: ./gradlew :crypto:cargoNdkBuild --console=plain

      - name: 启动 Android 模拟器（API 36.1 x86_64，headless + KVM）并等待启动完成
        run: |
          set -euo pipefail
          # ISSUE-P2-314：avdmanager 与 emulator 对 AVD home 各自解析，新版 runner 镜像 +
          # emulator 37.1.11 下两者不一致（run #352 实证 `Unknown AVD name [ci-device]`、
          # ini 不在 $HOME/.android/avd）——显式钉死 ANDROID_AVD_HOME 令两侧共用同一路径。
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | avdmanager create avd \
            --name ci-device \
            --package "system-images;android-36.1;google_apis;x86_64" \
            --device pixel
          # 创建后立即硬断言 ini 落位：avdmanager 落到别处（如 ANDROID_USER_HOME/avd）
          # 时连同 .avd 目录迁移并留痕；完全未产出则秒级显式报错，不空等兜底循环。
          if [ ! -f "$ANDROID_AVD_HOME/ci-device.ini" ]; then
            SRC="$(find "$HOME" -maxdepth 6 -name 'ci-device.ini' 2>/dev/null | head -1)"
            if [ -n "$SRC" ]; then
              echo "avdmanager 落位与 ANDROID_AVD_HOME 不一致：$SRC → 迁移"
              cp -a "$(dirname "$SRC")"/ci-device.ini "$(dirname "$SRC")"/ci-device.avd "$ANDROID_AVD_HOME"/
            else
              echo "::error::avdmanager 未产出 ci-device.ini"
              exit 1
            fi
          fi
          adb start-server
          # ISSUE-P2-314：run #353 实证 runner 镜像的 /dev/kvm 存在但当前用户不在 kvm 组
          # （`This user doesn't have permissions to use KVM`，/etc/group 的 kvm 行无用户名）
          # ——runner 为一次性环境，放权无持久化风险；/dev/kvm 缺失（宿主未开嵌套虚拟化）
          # 则秒级显式报错而非空等兜底。
          test -e /dev/kvm || { echo "::error::/dev/kvm 不存在（runner 宿主未提供嵌套虚拟化）"; exit 1; }
          sudo chmod 666 /dev/kvm
          # ISSUE-P2-314：ubuntu-24.04 runner 镜像不把 emulator 目录放进 PATH
          # （2026-09-24 run #351 实证 `emulator: command not found`），必须走 SDK 内全路径；
          # 并先断言二进制存在，把该类失败从「后台静默 + 等待挂死」提前到秒级显式报错。
          EMU_BIN="${ANDROID_SDK_ROOT}/emulator/emulator"
          test -x "$EMU_BIN" || { echo "::error::emulator 二进制不存在：$EMU_BIN"; exit 1; }
          "$EMU_BIN" -avd ci-device \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on -port 5554 &
          # ISSUE-P2-314：裸 `adb wait-for-device` 在设备永不出现时无限阻塞，且原写法位于
          # 启动兜底循环之前，使 20 分钟兜底执行不到（run #351 挂满 120 分钟被超时强杀）。
          # 删除该调用：循环内的 getprop 探测同时覆盖「设备上线」与「启动完成」两阶段，
          # 设备未上线时 adb shell 立即报错、经 `|| true` 降级为空读数后按轮重试。
          for i in $(seq 1 120); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            [ "$boot" = "1" ] && break
            sleep 10
          done
          boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
          if [ "$boot" != "1" ]; then
            echo "::error::模拟器 20 分钟内未完成启动"
            exit 1
          fi
          adb devices

      - name: 全模块 connected 测试（device 层门禁真实执行）
        # ISSUE-P2-314：run #354 实证此处原为「行内 plain scalar + 反斜杠续行」——YAML 把
        # 「反斜杠+换行」折叠为「反斜杠+空格」，bash 将 `\ ` 解释为转义空格，gradle 收到
        # 带前导空格的 " -Pandroid…notClass=…" 误判为任务名（Task not found），connected
        # 自该写法引入起从未真正执行。改块字面量令反斜杠+换行成为真实续行。
        run: |
          ./gradlew connectedDebugAndroidTest --console=plain \
            -Pandroid.testInstrumentationRunnerArguments.notClass=com.keepasskey.app.autofill.AutofillAuthChainDeviceTest

      # ISSUE-P3-493（2026-10-05 立规）：上一步的 `BUILD SUCCESSFUL` **不构成**「用例真的跑了」的
      # 证据——实测 AVD 在被测进程起不来时产出 `<testsuites tests="0"/>` + `test-result-exit-code.txt=0`
      # + `BUILD SUCCESSFUL`（`am instrument` 的「零用例」返回成功码，UTP 据此归为成功），
      # 整层门禁空转而显绿。本步按判据断言各层 `tests > 0`（缺结果 XML 亦判「无法判定」，
      # 同样非绿），fail-closed，**不得**加 `|| true` / `continue-on-error`。
      # `if: always()`：即使上一步已红，也把「跑了几条」的读数与空转判定打出来（诊断用途）。
      - name: 断言 connected 结果非空转（ISSUE-P3-493）
        if: always()
        run: python3 tools/device/check_connected_device_results.py

      - name: 归档 connected 测试报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-gate-reports
          path: |
            **/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
