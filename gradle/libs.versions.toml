# Gradle 版本目录（TASK-05）：5 模块插件与依赖集中管理，杜绝版本漂移。
# 版本货币性核对（2026-09-08）：hilt 2.60.1 / credentials 1.6.0 / okhttp 5.5.0 /
# coroutines 1.11.0 / zxing 4.3.0 均为当前稳定渠道版本。
# Dependabot PR #1/#2/#3 批量落地：AGP 9.4.0 / navigation 2.10.0 / hilt-ext 1.4.0 /
# bcprov 1.85.2 / coroutines 1.11.0 / okhttp 5.5.0 / foojay-resolver 1.0.0 / wrapper 9.7.1
[versions]
agp = "9.4.0"
# Kotlin 版本：经顶层 buildscript classpath 提升内置 Kotlin 的 KGP 至 2.4.10，
# Compose 编译器插件版本必须与之一致
kotlin = "2.4.10"
# KSP 2.3.x 起独立版本号（与 Kotlin 解耦）；AGP 9 要求 ≥ 2.3.6
ksp = "2.3.11"
hilt = "2.60.1"
hiltExt = "1.4.0"
coreKtx = "1.19.0"
composeBom = "2026.08.00"
# TASK-07：M3 Expressive 公开 API（MaterialExpressiveTheme/MotionScheme）在 1.5.0 才毕业公开，
# 1.4.0 stable 中仍为 internal；显式采用 1.5.0-alpha27（BOM 映射被显式依赖覆盖）
material3 = "1.5.0-alpha27"
lifecycle = "2.9.0"
activityCompose = "1.10.0"
navigationCompose = "2.10.0"
biometric = "1.1.0"
credentials = "1.6.0"
work = "2.10.0"
autofill = "1.3.0"
zxing = "4.3.0"
okhttp = "5.5.0"
bouncycastle = "1.85.2"
coroutines = "1.11.0"
junit = "4.13.2"
androidxAnnotation = "1.9.1"
datastore = "1.2.1"
profileinstaller = "1.4.1"
foojayResolver = "1.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 显式版本（覆盖 BOM 映射）：M3 Expressive 公开 API 载体
compose-material3-alpha = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltExt" }

credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
autofill = { group = "androidx.autofill", name = "autofill", version.ref = "autofill" }
biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
zxing-embedded = { group = "com.journeyapps", name = "zxing-android-embedded", version.ref = "zxing" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version.ref = "bouncycastle" }

coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# Kotlin 2.0 起 Compose 编译器随 Kotlin 一同发布，版本必须与 Kotlin 保持一致
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
