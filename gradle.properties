org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 并发上限：本机 28GB 内存下多任务/多会话并行构建曾耗尽内存（15 个 JVM / 12GB，仅剩 1GB）
# 并导致构建进程被 OOM 终止；此处固定 Gradle 与 Kotlin daemon 的内存与并发上限。
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1536m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# TASK-03：已迁移 AGP 9 内置 Kotlin（kotlin-android / kapt 插件均已移除，kapt→KSP），
# 官方要求迁移完成后移除 android.builtInKotlin / android.newDsl 两个 opt-out 旗标
